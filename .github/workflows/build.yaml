name: "Terraform Module Build"

on:
  pull_request:
    types: 
      - closed

permissions:
  id-token: write
  contents: write

jobs:
  build:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs')
      && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        ref: main
        fetch-depth: 0
    
    - name: Bump version and push tag
      id: tag
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }} 
        WITH_V: true
    
    - name: Generate release
      uses: sentania-labs/.github/.github/actions/tag-to-release@v1
      with:
        tag: ${{ steps.tag.outputs.tag }}
